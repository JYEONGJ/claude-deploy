<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>멜론 차트 2 TOP 100</title>
<style>
:root{--green:#00cd3c;--green-dark:#00a82f;--ink:#222;--sub:#666;--mute:#999;--line:#e5e5e5;--bg:#fff;--soft:#f6f6f6}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Pretendard","Malgun Gothic","Apple SD Gothic Neo",sans-serif;color:var(--ink);background:var(--bg);font-size:14px}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}
.wrap{max-width:1100px;margin:0 auto;padding:0 20px}

/* top utility */
.util{font-size:11px;color:var(--sub)}
.util .wrap{display:flex;justify-content:space-between;padding-top:8px;padding-bottom:8px}
.util span+span{margin-left:14px}

/* header */
header{border-bottom:1px solid var(--line);background:#fff;position:sticky;top:0;z-index:10}
.hd{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:64px}
.hd-l,.hd-r{display:flex;align-items:center;gap:18px}
.hd-r{justify-content:flex-end}
.logo{font-size:26px;font-weight:900;letter-spacing:.35em;color:var(--green);padding-left:.35em}
nav.gnb{display:flex;gap:44px;font-size:15px;font-weight:600}
.hd-l nav.gnb{margin-left:40px}
.ico{width:22px;height:22px;stroke:var(--ink);fill:none;stroke-width:1.8}
.hd-r a{font-size:12px;color:var(--sub)}

/* breadcrumb */
.crumb{font-size:12px;color:var(--mute);padding:14px 0}
.crumb i{margin:0 6px;font-style:normal}

h1{font-size:24px;font-weight:500;margin:10px 0 24px}

/* tabs */
.tabs{display:grid;grid-template-columns:repeat(5,1fr);border-bottom:1px solid var(--line)}
.tab{background:#fff;border:1px solid var(--line);border-bottom:0;margin-left:-1px;padding:13px 0;font-size:14px;color:var(--sub)}
.tab:first-child{margin-left:0}
.tab.on{color:var(--green-dark);font-weight:700;border-top:2px solid var(--green);border-bottom:1px solid #fff;margin-bottom:-1px}

/* filter row */
.filter{display:flex;justify-content:space-between;align-items:center;margin:22px 0 18px}
.fl{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--sub)}
.switch{width:30px;height:16px;border-radius:8px;background:#ccc;position:relative}
.switch::after{content:"";position:absolute;left:2px;top:2px;width:12px;height:12px;border-radius:50%;background:#fff}
.fl b{color:var(--ink);font-weight:600}
.search{display:flex;align-items:center;border:1px solid var(--line);background:var(--soft);width:210px;padding:0 10px;height:30px}
.search input{border:0;background:transparent;flex:1;font-size:12px;outline:none;font-family:inherit}
.search svg{width:14px;height:14px;stroke:var(--mute);fill:none;stroke-width:2}

/* grid */
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:46px 18px}
.card{min-width:0}
.cover{position:relative;aspect-ratio:1/1;overflow:hidden;border-radius:4px;background:#eee}
.cover img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .3s}
.card:hover .cover img{transform:scale(1.05)}
.rank{position:absolute;left:8px;top:2px;color:#fff;font-size:32px;font-style:italic;font-weight:300;text-shadow:0 1px 6px rgba(0,0,0,.6)}
.card:nth-child(-n+3) .rank{font-weight:800;color:#fff}
.badge{position:absolute;right:0;top:0;background:var(--green);color:#fff;font-size:10px;font-weight:700;padding:3px 6px;line-height:1.2}
.info{margin-top:10px}
.title{display:flex;align-items:center;gap:6px;font-size:16px;font-weight:500}
.title span{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.age{flex:none;width:20px;height:20px;border-radius:3px;background:var(--green);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center}
.artist{margin-top:5px;font-size:12px;color:var(--sub);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.btns{display:flex;gap:4px;margin-top:10px;align-items:center}
.like{flex:none;display:flex;align-items:center;gap:5px;border:1px solid var(--line);background:#fff;height:26px;padding:0 10px;border-radius:2px;font-size:11px;color:var(--sub)}
.like svg{width:13px;height:13px;stroke:var(--mute);fill:none;stroke-width:2}
.like.on svg{fill:#ff4b5c;stroke:#ff4b5c}
.play{flex:1;height:26px;border:0;background:var(--green);color:#fff;font-size:12px;font-weight:600;border-radius:2px}
.play:hover{background:var(--green-dark)}

/* more */
.more{margin:56px 0 70px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);text-align:center}
.more button{background:none;border:0;padding:14px 40px;font-size:12px;color:var(--sub)}
.more.hide{display:none}

/* footer */
footer{border-top:1px solid var(--line);background:#fafafa;padding:22px 0 40px;font-size:11px;color:var(--sub)}
.fnav{display:flex;flex-wrap:wrap;gap:14px;margin-bottom:22px}
.fnav b{color:var(--ink)}
.fmain{display:flex;align-items:center;gap:22px}
.flogo{font-size:20px;font-weight:900;letter-spacing:.3em;color:var(--green);flex:none}
.fmain p{line-height:1.7}
.sns{margin-left:auto;display:flex;gap:8px}
.sns i{width:22px;height:22px;border-radius:50%;background:#888;display:block}

@media(max-width:900px){.grid{grid-template-columns:repeat(3,1fr)}nav.gnb{gap:22px}.hd-l nav.gnb{display:none}}
@media(max-width:640px){
 .grid{grid-template-columns:repeat(2,1fr);gap:32px 12px}
 .hd{grid-template-columns:auto 1fr auto}.hd-r a{display:none}
 nav.gnb{display:none}.tabs{grid-template-columns:repeat(3,1fr)}.tab:nth-child(n+4){display:none}
 .filter{flex-direction:column;align-items:stretch;gap:10px}.search{width:100%}
 .fmain{flex-direction:column;align-items:flex-start}.sns{margin-left:0}
}
</style>
</head>
<body>

<div class="util"><div class="wrap">
  <div><span>VIP LOUNGE</span><span>멤버십</span><span>고객센터</span></div>
  <div><span>로그인</span><span>회원가입</span><span>빠른예매</span></div>
</div></div>

<header><div class="wrap hd">
  <div class="hd-l">
    <svg class="ico" viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
    <svg class="ico" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-5-5"/></svg>
    <nav class="gnb"><a href="#">차트</a><a href="#">최신음악</a><a href="#">장르</a></nav>
  </div>
  <a class="logo" href="#">MELON</a>
  <div class="hd-r">
    <nav class="gnb"><a href="#">이벤트</a><a href="#">스토어</a><a href="#">혜택</a></nav>
    <svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg>
  </div>
</div></header>

<main class="wrap">
  <div class="crumb">⌂<i>›</i>음악<i>›</i>멜론 차트</div>
  <h1>멜론 차트 TOP 100</h1>

  <div class="tabs">
    <button class="tab on">TOP 100</button>
    <button class="tab">24Hits</button>
    <button class="tab">HOT 100</button>
    <button class="tab">주간 차트</button>
    <button class="tab">월간 차트</button>
  </div>

  <div class="filter">
    <div class="fl"><span class="switch"></span>실시간 순위&nbsp;&nbsp;<span id="count"></span></div>
    <label class="search"><input id="q" placeholder="곡명 / 아티스트 검색"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-5-5"/></svg></label>
  </div>

  <div class="grid" id="grid"></div>

  <div class="more" id="more"><button id="moreBtn">더보기 ⌄</button></div>
</main>

<footer><div class="wrap">
  <div class="fnav"><span>회사소개</span><span>인재채용</span><span>사회공헌</span><span>제휴/광고</span><span>이용약관</span><b>개인정보처리방침</b><span>운영정책</span></div>
  <div class="fmain">
    <div class="flogo">MELON</div>
    <p>서울특별시 강남구 테헤란로 · 고객센터 1566-0000<br>COPYRIGHT © MELON Sample Page. All rights reserved</p>
    <div class="sns"><i></i><i></i><i></i></div>
  </div>
</div></footer>

<script src="js/melon.js"></script>
</body>
</html>
