<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>할일 목록 | Todo</title>
    <meta name="description" content="오늘 해야 할 일을 추가하고, 완료 체크와 수정, 삭제까지 한 번에 관리할 수 있는 심플한 할일 목록 페이지입니다.">
    <style>
        :root {
            --bg: #f4f5fb;
            --card: #fff;
            --text: #1f2333;
            --muted: #9aa0b4;
            --line: #eceef6;
            --accent: #6c5ce7;
            --danger: #ff5c7a;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(135deg, #eef0ff, #fdf1f7);
            color: var(--text);
            font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
            display: flex;
            justify-content: center;
            padding: 48px 16px;
        }
        main {
            width: 100%;
            max-width: 480px;
            background: var(--card);
            border-radius: 24px;
            padding: 32px 28px;
            box-shadow: 0 20px 50px rgba(108, 92, 231, .12);
            align-self: flex-start;
        }
        h1 { margin: 0; font-size: 28px; letter-spacing: -.02em; }
        .sub { margin: 6px 0 24px; color: var(--muted); font-size: 14px; }
        .sub b { color: var(--accent); }
        form.add { display: flex; gap: 8px; margin-bottom: 20px; }
        input[type="text"] {
            flex: 1;
            min-width: 0;
            padding: 12px 16px;
            border: 1.5px solid var(--line);
            border-radius: 12px;
            font: inherit;
            background: var(--bg);
            outline: none;
            transition: border-color .15s;
        }
        input[type="text"]:focus { border-color: var(--accent); background: #fff; }
        button, .btn { font: inherit; cursor: pointer; }
        .primary {
            padding: 0 18px;
            border: 0;
            border-radius: 12px;
            background: var(--accent);
            color: #fff;
            font-weight: 600;
        }
        .primary:hover { filter: brightness(1.08); }
        ul { list-style: none; margin: 0; padding: 0; }
        .item {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 10px 0;
            border-bottom: 1px solid var(--line);
        }
        .item:last-child { border-bottom: 0; }
        .grow { flex: 1; min-width: 0; margin: 0; }
        .text {
            width: 100%;
            padding: 6px 0;
            border: 0;
            background: none;
            color: var(--text);
            text-align: left;
            font-size: 16px;
            word-break: break-all;
        }
        .text.done { text-decoration: line-through; color: var(--muted); }
        .btn {
            padding: 6px 10px;
            border: 0;
            border-radius: 8px;
            background: none;
            color: var(--muted);
            font-size: 13px;
            text-decoration: none;
        }
        .btn:hover { background: var(--bg); color: var(--accent); }
        .btn.danger:hover { color: var(--danger); }
        .edit { display: flex; flex: 1; gap: 6px; margin: 0; }
        .edit .primary { padding: 0 14px; }
        .empty { padding: 24px 0; text-align: center; color: var(--muted); }
    </style>
</head>
<body>
    <main>
        <header>
            <h1>할일 목록</h1>
            <p class="sub">남은 할일 <b>{{REMAIN}}</b>개 · 항목을 누르면 완료 처리돼요</p>
        </header>
        <form class="add" action="/todo" method="post">
            <input type="text" name="text" placeholder="새 할일을 입력하세요" aria-label="새 할일" required>
            <button type="submit" class="primary">추가</button>
        </form>
        <ul>{{LIST}}</ul>
    </main>
</body>
</html>
