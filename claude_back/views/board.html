<section class="bd-wrap bd-top">
    <div class="bd-titlebar">
        <h1>게시판</h1>
        <span class="bd-crumb">홈 › 게시판</span>
    </div>
    <div class="bd-hero">
        <h2>여러분의 이야기를 기다려요!</h2>
        <p>여행, 맛집, 운동, 독서, 개발까지 자유롭게 글을 남겨 보세요.<br>다른 회원들의 이야기에 의견을 나눠 보세요.</p>
        <a class="bd-btn bd-btn-dark" href="/board/new">글 작성하기</a>
    </div>
</section>

<section class="bd-wrap bd-list">
    <div class="bd-toolbar">
        <p class="bd-count">모두 <strong>{{total}}</strong>개가 있어요{{searchLabel}}</p>
        <form class="bd-search" method="get" action="/board" role="search">
            <input type="search" name="q" value="{{q}}" maxlength="100" placeholder="제목 또는 내용 검색" aria-label="검색어">
            <button type="submit" class="bd-btn bd-btn-primary">검색</button>
            <select name="field" aria-label="검색 범위">
                <option value="all"{{{selAll}}}>제목+내용</option>
                <option value="title"{{{selTitle}}}>제목</option>
                <option value="content"{{{selContent}}}>내용</option>
            </select>
        </form>
    </div>

    {{{items}}}

    <div class="bd-write-row">
        <a class="bd-btn bd-btn-round" href="/board/new">글쓰기</a>
    </div>

    {{{pagination}}}
</section>
