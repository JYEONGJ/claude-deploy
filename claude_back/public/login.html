<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>로그인 | Member</title>
    <meta name="description" content="Member 서비스에 이메일 주소와 비밀번호로 안전하게 로그인하세요. 로그인하면 마이페이지에서 가입한 회원 정보를 확인하고 수정하거나 회원 탈퇴까지 한 곳에서 간편하고 편리하게 관리할 수 있는 Member 회원 전용 로그인 페이지입니다.">
    <!-- 로그인 화면은 검색 결과에 노출할 필요가 없어 색인 제외 -->
    <meta name="robots" content="noindex, nofollow">
    <link rel="canonical" href="http://localhost:10000/login.html">

    <meta property="og:type" content="website">
    <meta property="og:title" content="로그인 | Member">
    <meta property="og:description" content="Member 서비스에 이메일 주소와 비밀번호로 안전하게 로그인하세요. 로그인하면 마이페이지에서 가입한 회원 정보를 확인하고 수정하거나 회원 탈퇴까지 한 곳에서 간편하고 편리하게 관리할 수 있는 Member 회원 전용 로그인 페이지입니다.">

    <link rel="stylesheet" href="member.css">
</head>
<body>
<div class="page">
    <header class="nav">
        <div class="nav-brand">
            <span class="mark blueprint"><i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>M</span>
            MEMBER
        </div>
        <nav class="nav-links" aria-label="주요 메뉴">
            <a href="login.html" aria-current="page">로그인</a>
            <a href="signup.html">회원가입</a>
            <a href="mypage.html">마이페이지</a>
        </nav>
    </header>

    <main class="main">
        <div class="page-head">
            <div>
                <span class="card-kicker">Sign in</span>
                <h1>로그인</h1>
            </div>
        </div>

        <form class="login-form" id="loginForm" novalidate>
            <div class="field"><label for="l-email">이메일 주소(아이디)</label>
                <input class="input" id="l-email" type="email" autocomplete="username" placeholder="example@email.com"></div>
            <div class="field"><label for="l-pw">비밀번호</label>
                <div class="pw-wrap">
                    <input class="input" id="l-pw" type="password" autocomplete="current-password" placeholder="비밀번호를 입력해 주세요.">
                    <button type="button" class="btn btn-ghost btn-icon" id="togglePw" aria-label="비밀번호 표시">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"></path><circle cx="12" cy="12" r="3"></circle></svg>
                    </button>
                </div>
            </div>
            <a href="#" class="forgot">비밀번호를 잊어버리셨나요?</a>
            <p class="error" id="loginError" role="alert" hidden></p>
            <button type="submit" class="btn btn-primary blueprint btn-wide"><i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>로그인</button>
        </form>

        <div class="divider" aria-hidden="true"><span></span><em>또는</em><span></span></div>

        <div class="signup-box">
            <a href="signup.html" class="btn btn-secondary btn-wide">신규 회원가입</a>
            <p>서비스 이용을 위해 회원가입이 필요합니다. 회원가입 후 다양한 혜택을 누려보세요.</p>
        </div>
    </main>

    <footer class="footer">
        <nav aria-label="약관"><a href="#">이용약관</a><a href="#">개인정보처리방침</a></nav>
        <small>Copyright © Member Co., Ltd. All rights reserved.</small>
    </footer>
</div>
<script src="login.js"></script>
</body>
</html>
