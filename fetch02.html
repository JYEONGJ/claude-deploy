<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Photos 2x5 Flex Gallery</title>
<style>
  /* body: 페이지 전체 배경과 폰트 설정 */
  body {
    margin: 0;
    padding: 40px 20px;
    font-family: 'Segoe UI', sans-serif;
    background: #f4f5f7;
    color: #222;
  }

  /* h1: 페이지 제목 중앙 정렬 */
  h1 { text-align: center; margin-bottom: 30px; }

  /* #gallery: flex 컨테이너. 한 줄에 5개씩 배치되도록 wrap 허용, 가운데 정렬 */
  #gallery {
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    max-width: 1100px;
    margin: 0 auto;
  }

  /* .item: 5열이 되도록 너비 계산 (전체 4개 gap=64px 제외 후 5등분) */
  .item {
    flex: 0 0 calc((100% - 64px) / 5);
    background: #fff;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 2px 8px rgba(0,0,0,.12);
    transition: transform .2s;
  }
  .item:hover { transform: translateY(-4px); }
  .item { cursor: pointer; }

  /* #modal: 화면 전체를 덮는 반투명 배경, flex로 팝업을 정중앙 배치 (기본은 숨김) */
  #modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.7);
    justify-content: center;
    align-items: center;
    z-index: 1000;
  }
  #modal.open { display: flex; }

  /* .modal-box: 확대된 카드를 담는 팝업 본체 */
  .modal-box {
    position: relative;
    background: #fff;
    border-radius: 12px;
    padding: 16px;
    max-width: 90vw;
    max-height: 90vh;
    text-align: center;
    box-shadow: 0 10px 40px rgba(0,0,0,.5);
  }
  .modal-box img { display: block; width: min(600px, 80vw); aspect-ratio: 1 / 1; object-fit: cover; border-radius: 8px; }
  .modal-box p { margin: 12px 0 0; font-size: 16px; font-weight: 600; }

  /* #modal-close: 팝업 우상단 X 닫기 버튼 */
  #modal-close {
    position: absolute;
    top: -14px;
    right: -14px;
    width: 36px;
    height: 36px;
    border: none;
    border-radius: 50%;
    background: #e5484d;
    color: #fff;
    font-size: 20px;
    line-height: 1;
    cursor: pointer;
  }

  /* img: 카드 너비에 맞춰 정사각형으로 표시 */
  .item img {
    display: block;
    width: 100%;
    aspect-ratio: 1 / 1;
    object-fit: cover;
  }

  /* .item p: 사진 제목 (길면 말줄임) */
  .item p {
    margin: 0;
    padding: 8px 10px;
    font-size: 12px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
</style>
</head>
<body>
  <h1>Photo Gallery (2행 × 5열)</h1>
  <!-- 이미지 카드가 동적으로 삽입될 영역 -->
  <div id="gallery"></div>

  <!-- 카드 클릭 시 표시되는 팝업 (배경 클릭 / X 버튼 / ESC로 닫힘) -->
  <div id="modal">
    <div class="modal-box">
      <button id="modal-close" aria-label="닫기">&times;</button>
      <img id="modal-img" src="" alt="">
      <p id="modal-title"></p>
    </div>
  </div>

<script src="js/fetch02.js"></script>
</body>
</html>
