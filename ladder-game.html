<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ranking Game | Ladder</title>
<style>
  :root { --bg:#f5f6fa; --card:#fff; --text:#222; --muted:#777; --line:#cfd3dc; --main:#4f46e5; --done:#9aa0ad; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:"Segoe UI",Arial,sans-serif; background:var(--bg); color:var(--text); }
  .wrap { max-width:960px; margin:0 auto; padding:24px 16px 48px; }
  h1 { margin:0 0 4px; font-size:28px; }
  .sub { color:var(--muted); margin-bottom:20px; }
  .panel { background:var(--card); border-radius:12px; padding:18px; box-shadow:0 2px 8px rgba(0,0,0,.06); margin-bottom:16px; }
  .teams, #result { margin-top:10px; }
  .teams { display:grid; grid-template-columns:repeat(5,1fr); gap:8px; }
  .teams input { width:100%; padding:8px; border:1px solid var(--line); border-radius:6px; font-size:14px; }
  .btns { margin-top:14px; display:flex; gap:8px; flex-wrap:wrap; }
  button { padding:10px 16px; border:0; border-radius:8px; background:var(--main); color:#fff; font-size:14px; cursor:pointer; }
  button.ghost { background:#e8e9f3; color:#333; }
  button:disabled { opacity:.45; cursor:default; }
  .stage { overflow-x:auto; }
  .heads { display:flex; }
  .heads button { flex:1 1 0; min-width:0; margin:0 4px; padding:10px 2px; font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .heads button.used { background:var(--done); }
  canvas { display:block; width:100%; }
  .foot { display:flex; }
  .foot div { flex:1 1 0; text-align:center; font-weight:700; padding:8px 0; margin:0 4px; background:#eef0f6; border-radius:8px; font-size:15px; }
  .foot div.hit { background:var(--main); color:#fff; }
  .hint { color:var(--muted); font-size:13px; margin-top:10px; }
  ol { margin:0; padding-left:0; list-style:none; display:grid; grid-template-columns:repeat(5,1fr); gap:8px; }
  li { background:#eef0f6; border-radius:8px; padding:10px; font-size:14px; min-height:44px; }
  li b { color:var(--main); margin-right:6px; }
  @media (max-width:700px) { .teams, ol { grid-template-columns:repeat(2,1fr); } .heads button { font-size:11px; } }
</style>
</head>
<body>
<div class="wrap">
  <h1>Ranking Game</h1>
  <div class="sub">Ladder game to decide the presentation order of the performance review</div>

  <div class="panel">
    <b>Teams (10)</b> — edit the names if you like
    <div class="teams" id="teams"></div>
    <div class="btns">
      <button id="newBtn">Shuffle New Ladder</button>
      <button id="allBtn" class="ghost">Reveal All</button>
    </div>
  </div>

  <div class="panel stage">
    <div class="heads" id="heads"></div>
    <canvas id="cv" height="460"></canvas>
    <div class="foot" id="foot"></div>
    <div class="hint">Click a team name to trace its path down the ladder. The rungs stay hidden until they are walked.</div>
  </div>

  <div class="panel">
    <b>Presentation Order</b>
    <ol id="result"></ol>
  </div>
</div>

<script src="js/ladder-game.js"></script>
</body>
</html>
